<script>
  // ── Carousel videos (home page only) ─────────────────────────────────
  const homeVideos = [
    { id: 'd09YMPZi1iI', title: ' "BEACHRADIO" Experimental Sci-Fi shortfilm 2026 ' },
    { id: 'UlnY-5KqL3k', title: '"BAD INFLUENCE"  A school assignment 2025' },
    { id: 'kbzzbJusTTw', title: '"Sinking cities" A school assignment 2025' },
  ];

  let currentIndex = 0;
  let loadedSlides = new Set();

  const track     = document.getElementById('track');
  const dotsEl    = document.getElementById('dots');
  const captionEl = document.getElementById('caption');
  const navButtons = document.querySelectorAll('nav.sections button');

  // ── Render carousel ───────────────────────────────────────────────────
  function renderCarousel() {
    track.innerHTML = '';
    dotsEl.innerHTML = '';

    homeVideos.forEach((video, i) => {
      const slide = document.createElement('div');
      slide.className = 'slide';

      if (loadedSlides.has(i)) {
        slide.innerHTML = `<iframe
          src="https://www.youtube-nocookie.com/embed/${video.id}?autoplay=1&rel=0"
          allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
      } else {
        slide.innerHTML = `
          <div class="placeholder" data-play="${i}" style="background-image:url('https://img.youtube.com/vi/${video.id}/hqdefault.jpg')">
            <div class="placeholder-inner">
              <div class="play"></div>
              <span>${video.title}</span>
            </div>
          </div>`;
      }
      track.appendChild(slide);

      const dot = document.createElement('button');
      dot.className = i === currentIndex ? 'active' : '';
      dot.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(dot);
    });

    updatePosition();
    captionEl.textContent = homeVideos[currentIndex]?.title || '';
  }

  function updatePosition() {
    track.style.transform = `translateX(-${currentIndex * 100}%)`;
    [...dotsEl.children].forEach((d, i) => d.classList.toggle('active', i === currentIndex));
  }

  function goTo(i) {
    const newIndex = (i + homeVideos.length) % homeVideos.length;

    // If we're leaving a slide that has a playing video, unload it
    // so the iframe is destroyed and playback actually stops.
    if (newIndex !== currentIndex && loadedSlides.has(currentIndex)) {
      loadedSlides.delete(currentIndex);
    }

    currentIndex = newIndex;
    renderCarousel();
  }

  // ── Show a page ───────────────────────────────────────────────────────
  function showPage(pageId) {
    // Hide all pages
    document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
    // Show the one we want
    document.getElementById(pageId).style.display = 'flex';
  }

  // ── Name click = HOME ─────────────────────────────────────────────────
  document.getElementById('homeName').addEventListener('click', () => {
    navButtons.forEach(b => b.classList.remove('active'));
    showPage('page-home');
  });

  // ── Nav button clicks = their own page ───────────────────────────────
  navButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      navButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      showPage('page-' + btn.dataset.section);
    });
  });

  // ── Arrows ───────────────────────────────────────────────────────────
  document.querySelector('.arrow.prev').addEventListener('click', () => goTo(currentIndex - 1));
  document.querySelector('.arrow.next').addEventListener('click', () => goTo(currentIndex + 1));

  // ── Click play on a slide ─────────────────────────────────────────────
  track.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-play]');
    if (btn) {
      loadedSlides.add(Number(btn.dataset.play));
      renderCarousel();
    }
  });

  // ── Keyboard arrows ───────────────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft')  goTo(currentIndex - 1);
    if (e.key === 'ArrowRight') goTo(currentIndex + 1);
  });

  // ── Start on home ─────────────────────────────────────────────────────
  renderCarousel();
</script>
